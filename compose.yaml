# 開発・テスト用の DynamoDB Local(本番は AWS の DynamoDB を使う)
# 起動: docker compose up -d dynamodb
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      # このパソコンの中からだけつながる(認証の無い DB を、同じネットワークの他の機器に見せない)
      - "127.0.0.1:8000:8000"
