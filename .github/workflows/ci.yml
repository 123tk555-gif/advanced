name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 本番用ビルド(静的ファイルの書き出し)。Google マップのキーは入れない
      - run: pnpm --filter @tritri/web build
      # 依存部品の既知の脆弱性。high 以上で止める(moderate は報告書で管理)
      - run: pnpm audit --audit-level high

  # ブラウザでの操作テスト(開発用 API + 画面を起動して操作する)。4 つの環境で並べて流す
  e2e:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ブラウザを入れる
        run: |
          browser=${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
          pnpm --filter @tritri/e2e exec playwright install --with-deps "$browser"
      - run: pnpm --filter @tritri/e2e exec playwright test --project=${{ matrix.project }}
      # メールアドレスとパスワードのログイン(会員登録・確認コード・再設定・退会)。Cognito の代わりに試験用のログインで
      - if: matrix.project == 'chromium'
        run: pnpm --filter @tritri/e2e exec playwright test -c playwright.auth.config.ts --project=chromium
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-results-${{ matrix.project }}
          path: e2e/test-results/
          retention-days: 7
